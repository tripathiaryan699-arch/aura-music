name: Build AURA Music App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Auto Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/aura/music

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AURA"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aura.music"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aura.music"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.05.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("io.coil-kt:coil-compose:2.6.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="AURA"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Black.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/aura/music/MainActivity.kt
          package com.aura.music

          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil.compose.AsyncImage

          data class Song(
              val id: String,
              val title: String,
              val artist: String,
              val artUrl: String,
              val url: String,
              val isLocal: Boolean = false
          )

          class MainActivity : ComponentActivity() {
              private var player: MediaPlayer? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val defaultSongs = listOf(
                      Song("1", "Midnight Odyssey", "Aura Sound Lab", "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&q=80", "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"),
                      Song("2", "Cybernetic Dreams", "Kavinsky Wave", "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&q=80", "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"),
                      Song("3", "Neon Velocity", "Lofi Synthetics", "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=600&q=80", "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"),
                      Song("4", "Electric Pulse", "Aura Collective", "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&q=80", "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3")
                  )

                  setContent {
                      var songList by remember { mutableStateOf(defaultSongs) }
                      var currentSong by remember { mutableStateOf(defaultSongs[0]) }
                      var isPlaying by remember { mutableStateOf(false) }
                      var isExpanded by remember { mutableStateOf(false) }
                      var currentTab by remember { mutableStateOf("HOME") }
                      var searchQuery by remember { mutableStateOf("") }
                      val likedSongIds = remember { mutableStateListOf<String>() }
                      var progress by remember { mutableFloatStateOf(0f) }

                      val neon = Color(0xFF00FF66)
                      val bgBlack = Color(0xFF070708)
                      val surface = Color(0xFF141417)
                      val cardBg = Color(0xFF1E1E22)

                      fun playSong(song: Song) {
                          currentSong = song
                          player?.release()
                          player = MediaPlayer().apply {
                              setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                      .setUsage(AudioAttributes.USAGE_MEDIA)
                                      .build()
                              )
                              if (song.isLocal) {
                                  setDataSource(this@MainActivity, Uri.parse(song.url))
                              } else {
                                  setDataSource(song.url)
                              }
                              setOnPreparedListener {
                                  start()
                                  isPlaying = true
                              }
                              setOnCompletionListener {
                                  val nextIdx = (songList.indexOf(currentSong) + 1) % songList.size
                                  playSong(songList[nextIdx])
                              }
                              prepareAsync()
                          }
                      }

                      val audioPicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                          uri?.let {
                              val title = it.lastPathSegment?.substringAfterLast('/') ?: "Local Audio File"
                              val newSong = Song("loc_${System.currentTimeMillis()}", title, "Phone Storage", "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&q=80", it.toString(), true)
                              songList = listOf(newSong) + songList
                              playSong(newSong)
                          }
                      }

                      Box(modifier = Modifier.fillMaxSize().background(bgBlack)) {
                          Column(modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp)) {
                              Spacer(Modifier.height(36.dp))

                              // Top Header
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Column {
                                      Text("AURA", color = neon, fontSize = 32.sp, fontWeight = FontWeight.Black, letterSpacing = 2.sp)
                                      Text("Sound in full spectrum", color = Color(0xFF8E8E93), fontSize = 13.sp)
                                  }
                                  Text("● LIVE", color = neon, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }

                              Spacer(Modifier.height(18.dp))

                              // Screen Tab Content
                              when (currentTab) {
                                  "HOME" -> {
                                      LazyColumn(Modifier.weight(1f), contentPadding = PaddingValues(bottom = 140.dp)) {
                                          item {
                                              Text("Featured Albums", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                              Spacer(Modifier.height(12.dp))
                                              LazyRow(horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                                                  items(songList) { song ->
                                                      Column(Modifier.width(140.dp).clickable { playSong(song) }) {
                                                          AsyncImage(model = song.artUrl, contentDescription = null, modifier = Modifier.size(140.dp).clip(RoundedCornerShape(14.dp)), contentScale = ContentScale.Crop)
                                                          Spacer(Modifier.height(8.dp))
                                                          Text(song.title, color = Color.White, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                                          Text(song.artist, color = Color(0xFF8E8E93), fontSize = 12.sp, maxLines = 1)
                                                      }
                                                  }
                                              }
                                              Spacer(Modifier.height(24.dp))
                                              Text("Quick Picks", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                              Spacer(Modifier.height(12.dp))
                                          }
                                          items(songList) { song ->
                                              Row(
                                                  Modifier.fillMaxWidth().padding(vertical = 4.dp).clip(RoundedCornerShape(10.dp)).background(surface).clickable { playSong(song) }.padding(10.dp),
                                                  verticalAlignment = Alignment.CenterVertically
                                              ) {
                                                  AsyncImage(model = song.artUrl, contentDescription = null, modifier = Modifier.size(48.dp).clip(RoundedCornerShape(8.dp)), contentScale = ContentScale.Crop)
                                                  Spacer(Modifier.width(12.dp))
                                                  Column(Modifier.weight(1f)) {
                                                      Text(song.title, color = Color.White, fontWeight = FontWeight.Medium, maxLines = 1)
                                                      Text(song.artist, color = Color(0xFF8E8E93), fontSize = 12.sp, maxLines = 1)
                                                  }
                                                  Text("▶", color = neon, fontSize = 18.sp)
                                              }
                                          }
                                      }
                                  }
                                  "SEARCH" -> {
                                      Column(Modifier.weight(1f)) {
                                          TextField(
                                              value = searchQuery,
                                              onValueChange = { searchQuery = it },
                                              placeholder = { Text("Search songs or artists...", color = Color.Gray) },
                                              singleLine = true,
                                              shape = RoundedCornerShape(12.dp),
                                              colors = TextFieldDefaults.colors(focusedContainerColor = surface, unfocusedContainerColor = surface, focusedTextColor = Color.White, unfocusedTextColor = Color.White),
                                              modifier = Modifier.fillMaxWidth()
                                          )
                                          Spacer(Modifier.height(14.dp))
                                          val filtered = songList.filter { it.title.contains(searchQuery, true) || it.artist.contains(searchQuery, true) }
                                          LazyColumn(contentPadding = PaddingValues(bottom = 140.dp)) {
                                              items(filtered) { song ->
                                                  Row(
                                                      Modifier.fillMaxWidth().padding(vertical = 4.dp).clip(RoundedCornerShape(10.dp)).background(surface).clickable { playSong(song) }.padding(10.dp),
                                                      verticalAlignment = Alignment.CenterVertically
                                                  ) {
                                                      AsyncImage(model = song.artUrl, contentDescription = null, modifier = Modifier.size(46.dp).clip(RoundedCornerShape(8.dp)), contentScale = ContentScale.Crop)
                                                      Spacer(Modifier.width(12.dp))
                                                      Column(Modifier.weight(1f)) {
                                                          Text(song.title, color = Color.White)
                                                          Text(song.artist, color = Color.Gray, fontSize = 12.sp)
                                                      }
                                                      Text("▶", color = neon, fontSize = 16.sp)
                                                  }
                                              }
                                          }
                                      }
                                  }
                                  "LIBRARY" -> {
                                      Column(Modifier.weight(1f)) {
                                          Row(
                                              Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(cardBg).clickable { audioPicker.launch(arrayOf("audio/*")) }.padding(16.dp),
                                              verticalAlignment = Alignment.CenterVertically
                                          ) {
                                              Text("📁", fontSize = 24.sp)
                                              Spacer(Modifier.width(14.dp))
                                              Column(Modifier.weight(1f)) {
                                                  Text("Add Songs From Phone", color = Color.White, fontWeight = FontWeight.Bold)
                                                  Text("Select any MP3 from your phone storage", color = Color.Gray, fontSize = 12.sp)
                                              }
                                              Text("+", color = neon, fontSize = 24.sp, fontWeight = FontWeight.Bold)
                                          }
                                          Spacer(Modifier.height(14.dp))
                                          Row(
                                              Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(surface).padding(16.dp),
                                              verticalAlignment = Alignment.CenterVertically
                                          ) {
                                              Text("❤️", fontSize = 24.sp)
                                              Spacer(Modifier.width(14.dp))
                                              Column {
                                                  Text("Liked Tracks", color = Color.White, fontWeight = FontWeight.Bold)
                                                  Text("${likedSongIds.size} songs liked", color = neon, fontSize = 12.sp)
                                              }
                                          }
                                          Spacer(Modifier.height(18.dp))
                                          Text("Your Tracks", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
                                          Spacer(Modifier.height(8.dp))
                                          LazyColumn(contentPadding = PaddingValues(bottom = 140.dp)) {
                                              items(songList) { song ->
                                                  Row(Modifier.fillMaxWidth().padding(vertical = 4.dp).clip(RoundedCornerShape(8.dp)).background(surface).clickable { playSong(song) }.padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                                                      AsyncImage(model = song.artUrl, contentDescription = null, modifier = Modifier.size(40.dp).clip(RoundedCornerShape(6.dp)), contentScale = ContentScale.Crop)
                                                      Spacer(Modifier.width(12.dp))
                                                      Column(Modifier.weight(1f)) {
                                                          Text(song.title, color = Color.White, fontSize = 14.sp)
                                                          Text(if (song.isLocal)
