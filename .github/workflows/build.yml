name: Build AURA Music App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Auto Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/aura/music

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AURA"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aura.music"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aura.music"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.05.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-common:1.3.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="AURA"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Black.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/aura/music/MainActivity.kt
          package com.aura.music

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer

          class MainActivity : ComponentActivity() {
              private lateinit var player: ExoPlayer

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  player = ExoPlayer.Builder(this).build()

                  val songs = listOf(
                      "Midnight Odyssey" to "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                      "Cybernetic Dreams" to "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                      "Neon Velocity" to "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                      "Electric Pulse" to "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
                  )

                  setContent {
                      var currentTitle by remember { mutableStateOf(songs[0].first) }
                      var isPlaying by remember { mutableStateOf(false) }
                      val auraNeon = Color(0xFF00FF66)
                      val auraBlack = Color(0xFF070708)

                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(auraBlack)
                              .padding(20.dp)
                      ) {
                          Spacer(Modifier.height(24.dp))
                          Text("AURA", color = auraNeon, fontSize = 32.sp)
                          Text("Sound in full spectrum", color = Color(0xFF9E9EA7), fontSize = 14.sp)
                          Spacer(Modifier.height(24.dp))

                          LazyColumn(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              items(songs) { (title, url) ->
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clip(RoundedCornerShape(10.dp))
                                          .background(Color(0xFF1B1B1E))
                                          .clickable {
                                              currentTitle = title
                                              player.setMediaItem(MediaItem.fromUri(url))
                                              player.prepare()
                                              player.play()
                                              isPlaying = true
                                          }
                                          .padding(16.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Column(Modifier.weight(1f)) {
                                          Text(title, color = Color.White)
                                          Text("Aura Originals", color = Color(0xFF5E5E66), fontSize = 12.sp)
                                      }
                                      Icon(Icons.Default.PlayArrow, contentDescription = null, tint = auraNeon)
                                  }
                              }
                          }

                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(12.dp))
                                  .background(Color(0xFF121214))
                                  .padding(14.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(Modifier.weight(1f)) {
                                  Text(currentTitle, color = Color.White)
                                  Text("Now Playing", color = auraNeon, fontSize = 12.sp)
                              }
                              IconButton(onClick = {
                                  if (player.isPlaying) {
                                      player.pause()
                                      isPlaying = false
                                  } else {
                                      player.play()
                                      isPlaying = true
                                  }
                              }) {
                                  Icon(
                                      if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                      contentDescription = null,
                                      tint = auraNeon
                                  )
                              }
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player.release()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Music-Player
          path: app/build/outputs/apk/debug/*.apk
