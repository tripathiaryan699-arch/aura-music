name: Build AURA Music App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Auto Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/aura/music

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AURA"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aura.music"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aura.music"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.05.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="AURA"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Black.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/aura/music/MainActivity.kt
          package com.aura.music

          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              private var mediaPlayer: MediaPlayer? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val songs = listOf(
                      "Midnight Odyssey" to "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                      "Cybernetic Dreams" to "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                      "Neon Velocity" to "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                      "Electric Pulse" to "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
                  )

                  setContent {
                      var currentTitle by remember { mutableStateOf(songs[0].first) }
                      var isPlaying by remember { mutableStateOf(false) }
                      val neon = Color(0xFF00FF66)
                      val darkBg = Color(0xFF070708)
                      val cardBg = Color(0xFF1B1B1E)

                      fun playAudio(url: String, title: String) {
                          currentTitle = title
                          mediaPlayer?.release()
                          mediaPlayer = MediaPlayer().apply {
                              setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                      .setUsage(AudioAttributes.USAGE_MEDIA)
                                      .build()
                              )
                              setDataSource(url)
                              setOnPreparedListener {
                                  start()
                                  isPlaying = true
                              }
                              setOnCompletionListener {
                                  isPlaying = false
                              }
                              prepareAsync()
                          }
                      }

                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(darkBg)
                              .padding(20.dp)
                      ) {
                          Spacer(Modifier.height(30.dp))
                          Text("AURA", color = neon, fontSize = 34.sp, fontWeight = FontWeight.Bold)
                          Text("Sound in full spectrum", color = Color.Gray, fontSize = 14.sp)
                          Spacer(Modifier.height(24.dp))

                          LazyColumn(
                              modifier = Modifier.weight(1f),
                              verticalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              items(songs) { song ->
                                  val title = song.first
                                  val url = song.second
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clip(RoundedCornerShape(12.dp))
                                          .background(cardBg)
                                          .clickable { playAudio(url, title) }
                                          .padding(16.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Column(Modifier.weight(1f)) {
                                          Text(title, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Medium)
                                          Text("Aura Originals", color = Color(0xFF6E6E77), fontSize = 12.sp)
                                      }
                                      Text("▶", color = neon, fontSize = 20.sp)
                                  }
                              }
                          }

                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(14.dp))
                                  .background(Color(0xFF141416))
                                  .padding(16.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                          Column(Modifier.weight(1f)) {
                              Text(currentTitle, color = Color.White, fontWeight = FontWeight.SemiBold, fontSize = 15.sp)
                              Text(if (isPlaying) "Playing now" else "Paused", color = neon, fontSize = 12.sp)
                          }
                          IconButton(onClick = {
                              mediaPlayer?.let { player ->
                                  if (player.isPlaying) {
                                      player.pause()
                                      isPlaying = false
                                  } else {
                                      player.start()
                                      isPlaying = true
                                  }
                              } ?: run {
                                  playAudio(songs[0].second, songs[0].first)
                              }
                          }) {
                              Text(if (isPlaying) "⏸" else "▶", color = neon, fontSize = 24.sp)
                          }
                      }
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  mediaPlayer?.release()
                  mediaPlayer = null
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Music-Player
          path: app/build/outputs/apk/debug/*.apk
